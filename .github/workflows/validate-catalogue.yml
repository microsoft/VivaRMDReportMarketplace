name: Validate report catalogue

on:
  pull_request:
    paths:
      - "package.json"
      - "scripts/build-site.mjs"
      - "site/**"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "scripts/build-site.mjs"
      - "site/**"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm run site:validate
      - run: npm run site:build
