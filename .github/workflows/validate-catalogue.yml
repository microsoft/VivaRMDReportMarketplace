name: Validate report catalogue

on:
  pull_request:
    paths:
      - "package.json"
      - "scripts/build-site.mjs"
      - "site/**"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "scripts/build-site.mjs"
      - "site/**"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run site:validate
      - run: npm run site:build
